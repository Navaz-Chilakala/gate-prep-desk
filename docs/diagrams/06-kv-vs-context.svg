<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="420" fill="#FFFFFF"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#1F2937">KV cache size grows linearly with the context window (f16 cache, one sequence)</text>
  <!-- plot area: x 90..890 for 0..32768 tokens; y 360 (0) .. 60 (6 GiB) => 50 px per GiB -->
  <g font-size="11.5" fill="#6B7280">
    <line x1="90" y1="360" x2="890" y2="360" stroke="#9CA3AF"/>
    <line x1="90" y1="60" x2="90" y2="360" stroke="#9CA3AF"/>
    <g stroke="#EEF0F3">
      <line x1="90" y1="310" x2="890" y2="310"/><line x1="90" y1="260" x2="890" y2="260"/><line x1="90" y1="210" x2="890" y2="210"/>
      <line x1="90" y1="160" x2="890" y2="160"/><line x1="90" y1="110" x2="890" y2="110"/><line x1="90" y1="60" x2="890" y2="60"/>
    </g>
    <text x="80" y="364" text-anchor="end">0</text><text x="80" y="314" text-anchor="end">1 GiB</text><text x="80" y="264" text-anchor="end">2 GiB</text>
    <text x="80" y="214" text-anchor="end">3 GiB</text><text x="80" y="164" text-anchor="end">4 GiB</text><text x="80" y="114" text-anchor="end">5 GiB</text><text x="80" y="64" text-anchor="end">6 GiB</text>
    <g text-anchor="middle">
      <text x="90" y="380">0</text><text x="290" y="380">8 K</text><text x="490" y="380">16 K</text><text x="690" y="380">24 K</text><text x="890" y="380">32 K tokens</text>
    </g>
  </g>
  <!-- app setting -->
  <line x1="490" y1="50" x2="490" y2="360" stroke="#111827" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="497" y="76" font-size="12.5" font-weight="700" fill="#111827">this app: num_ctx 16,384</text>
  <!-- lines -->
  <line x1="90" y1="360" x2="890" y2="110" stroke="#B7791F" stroke-width="3"/>
  <line x1="90" y1="360" x2="890" y2="272.5" stroke="#7048C8" stroke-width="3"/>
  <line x1="90" y1="360" x2="890" y2="310" stroke="#2C4BB3" stroke-width="3"/>
  <!-- points at 16K -->
  <circle cx="490" cy="235" r="5" fill="#B7791F"/><circle cx="490" cy="316.25" r="5" fill="#7048C8"/><circle cx="490" cy="335" r="5" fill="#2C4BB3"/>
  <g font-size="12" font-weight="700">
    <text x="476" y="230" text-anchor="end" fill="#B7791F">2.5 GiB</text>
    <text x="476" y="308" text-anchor="end" fill="#7048C8">0.875 GiB</text>
    <text x="500" y="354" text-anchor="start" fill="#2C4BB3">0.5 GiB</text>
  </g>
  <!-- legend at line ends -->
  <g font-size="12.5">
    <text x="898" y="114" fill="#B7791F" font-weight="700">nemo 12B</text><text x="898" y="130" fill="#6B7280">160 KiB/token</text>
    <text x="898" y="270" fill="#7048C8" font-weight="700">coder 7B</text><text x="898" y="286" fill="#6B7280">56 KiB/token</text>
    <text x="898" y="314" fill="#2C4BB3" font-weight="700">qwen3.5:4b</text><text x="898" y="330" fill="#6B7280">32 KiB/token</text>
  </g>
  <text x="90" y="406" font-size="12" fill="#6B7280">Formula: KV bytes = attention layers × 2 (K and V) × KV heads × head size × bytes per value × tokens. A q8_0 cache halves every line; 2 parallel slots double it.</text>
</svg>
