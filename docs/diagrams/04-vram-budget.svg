<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#E5E7EB"/><line x1="0" y1="0" x2="0" y2="8" stroke="#CBD5E1" stroke-width="4"/></pattern>
  </defs>
  <rect width="1000" height="430" fill="#FFFFFF"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#1F2937">GPU memory (8,151 MiB card), drawn to scale · measured at num_ctx 16,384</text>

  <!-- axis -->
  <g font-size="11.5" fill="#6B7280" text-anchor="middle">
    <line x1="120" y1="320" x2="960" y2="320" stroke="#9CA3AF"/>
    <line x1="120" y1="315" x2="120" y2="325" stroke="#9CA3AF"/><text x="120" y="340">0</text>
    <line x1="225.5" y1="315" x2="225.5" y2="325" stroke="#9CA3AF"/><text x="225.5" y="340">1 GiB</text>
    <line x1="331" y1="315" x2="331" y2="325" stroke="#9CA3AF"/><text x="331" y="340">2</text>
    <line x1="436.6" y1="315" x2="436.6" y2="325" stroke="#9CA3AF"/><text x="436.6" y="340">3</text>
    <line x1="542.1" y1="315" x2="542.1" y2="325" stroke="#9CA3AF"/><text x="542.1" y="340">4</text>
    <line x1="647.6" y1="315" x2="647.6" y2="325" stroke="#9CA3AF"/><text x="647.6" y="340">5</text>
    <line x1="753.1" y1="315" x2="753.1" y2="325" stroke="#9CA3AF"/><text x="753.1" y="340">6</text>
    <line x1="858.7" y1="315" x2="858.7" y2="325" stroke="#9CA3AF"/><text x="858.7" y="340">7</text>
    <line x1="960" y1="50" x2="960" y2="325" stroke="#111827" stroke-width="2"/><text x="960" y="340" fill="#111827" font-weight="700">8 GB</text>
  </g>

  <!-- Bar A: qwen3.5 -->
  <text x="20" y="80" font-size="13.5" font-weight="700" fill="#1F2937">qwen3.5:4b</text>
  <text x="20" y="98" font-size="12" fill="#6B7280">all on the GPU</text>
  <rect x="120" y="66" width="259" height="46" fill="#2C4BB3"/>
  <text x="249.5" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">weights 2,515 MiB</text>
  <rect x="379" y="66" width="52.8" height="46" fill="#F59E0B"/>
  <text x="405.4" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">KV 512</text>
  <rect x="431.8" y="66" width="5.2" height="46" fill="#10B981"/>
  <rect x="437" y="66" width="18.6" height="46" fill="#8B5CF6"/>
  <rect x="455.6" y="66" width="23" height="46" fill="#EC4899"/>
  <rect x="478.6" y="66" width="141.9" height="46" fill="url(#h)"/>
  <text x="549.5" y="94" text-anchor="middle" font-size="11.5" fill="#374151">other apps</text>
  <rect x="620.5" y="66" width="339.5" height="46" fill="#FFFFFF" stroke="#D1D5DB" stroke-dasharray="4 3"/>
  <text x="790" y="94" text-anchor="middle" font-size="12" fill="#6B7280">free ≈ 3.2 GiB</text>
  <g font-size="11" fill="#374151">
    <line x1="434.4" y1="112" x2="434.4" y2="130" stroke="#10B981"/><text x="420" y="142" text-anchor="end">recurrent state 50</text>
    <line x1="446.3" y1="112" x2="446.3" y2="150" stroke="#8B5CF6"/><text x="436" y="160" text-anchor="end">compute 180</text>
    <line x1="467.1" y1="112" x2="467.1" y2="130" stroke="#EC4899"/><text x="475" y="142">vision encoder compute 223</text>
  </g>
  <text x="120" y="182" font-size="12.5" font-weight="700" fill="#1E3A8A">Total on GPU: 3,480 MiB = 3.40 GiB   ·   ~62 tokens/s generating</text>

  <!-- Bar B: mistral-nemo -->
  <text x="20" y="226" font-size="13.5" font-weight="700" fill="#1F2937">mistral-nemo</text>
  <text x="20" y="244" font-size="12" fill="#6B7280">12B · 25/41 layers</text>
  <rect x="120" y="212" width="439.9" height="46" fill="#B7791F"/>
  <text x="340" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">weights on GPU 4,268 MiB</text>
  <rect x="559.9" y="212" width="158.3" height="46" fill="#F59E0B"/>
  <text x="639" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">KV 1,536 MiB</text>
  <rect x="718.2" y="212" width="19.1" height="46" fill="#8B5CF6"/>
  <rect x="737.3" y="212" width="112.9" height="46" fill="url(#h)"/>
  <text x="793.7" y="240" text-anchor="middle" font-size="11.5" fill="#374151">other apps</text>
  <rect x="850.2" y="212" width="109.8" height="46" fill="#FFFFFF" stroke="#D1D5DB" stroke-dasharray="4 3"/>
  <text x="905" y="240" text-anchor="middle" font-size="11.5" fill="#6B7280">spare</text>
  <text x="120" y="282" font-size="12.5" font-weight="700" fill="#78350F">Total on GPU: 5,989 MiB = 5.85 GiB  ·  plus in RAM: 2,855 MiB weights + 1,024 MiB KV  ·  ~6.7 tokens/s</text>
  <text x="120" y="302" font-size="12" fill="#6B7280">Ollama keeps 457 MiB free as a safety margin and plans with the 6.5 GiB it sees as usable, so 16 layers stay on the CPU.</text>

  <!-- legend -->
  <g font-size="12" fill="#374151">
    <rect x="120" y="366" width="14" height="14" fill="#2C4BB3"/><text x="140" y="378">model weights</text>
    <rect x="245" y="366" width="14" height="14" fill="#F59E0B"/><text x="265" y="378">KV cache (f16)</text>
    <rect x="375" y="366" width="14" height="14" fill="#10B981"/><text x="395" y="378">recurrent state</text>
    <rect x="510" y="366" width="14" height="14" fill="#8B5CF6"/><text x="530" y="378">compute buffers</text>
    <rect x="650" y="366" width="14" height="14" fill="#EC4899"/><text x="670" y="378">vision encoder</text>
    <rect x="780" y="366" width="14" height="14" fill="url(#h)"/><text x="800" y="378">Windows, browser, etc.</text>
  </g>
  <text x="120" y="408" font-size="12" fill="#6B7280">"Other apps" from nvidia-smi at the time: desktop, browser and the idle image generator (about 0.6 GB).</text>
</svg>
