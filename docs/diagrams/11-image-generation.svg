<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="1000" height="330" fill="#FFFFFF"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#1F2937">Memory-hook pictures: Ollama on Windows cannot make images, so a separate engine draws them</text>
  <g font-size="12.5" fill="#374151">
    <rect x="20" y="50" width="170" height="120" rx="10" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/>
    <text x="34" y="74" font-weight="700" fill="#78350F">1 · Idea</text>
    <text x="34" y="96">qwen3.5 writes an</text>
    <text x="34" y="114">analogy, a caption</text>
    <text x="34" y="132">and a scene (JSON)</text>
    <line x1="190" y1="110" x2="212" y2="110" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="214" y="50" width="190" height="120" rx="10" fill="#E7F4EC" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="228" y="74" font-weight="700" fill="#14532D">2 · /api/imagegen</text>
    <text x="228" y="96">server starts sd-server.exe</text>
    <text x="228" y="114">on first use (port 7861,</text>
    <text x="228" y="132">CUDA build; Vulkan fallback)</text>
    <line x1="404" y1="110" x2="426" y2="110" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="428" y="50" width="240" height="120" rx="10" fill="#EFE9FB" stroke="#7048C8" stroke-width="1.5"/>
    <text x="442" y="74" font-weight="700" fill="#4C1D95">3 · Draw (SDXL-Turbo)</text>
    <text x="442" y="96">512 × 512, 4 steps, euler_a, cfg 1</text>
    <text x="442" y="114">first picture ~60 s (load and</text>
    <text x="442" y="132">convert fp16 → q8_0), then ~3 s</text>
    <text x="442" y="152">two versions with different seeds</text>
    <line x1="668" y1="110" x2="690" y2="110" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="692" y="50" width="288" height="120" rx="10" fill="#EEF2FB" stroke="#2C4BB3" stroke-width="1.5"/>
    <text x="706" y="74" font-weight="700" fill="#1E3A8A">4 · Judge and keep</text>
    <text x="706" y="96">vision model describes each picture,</text>
    <text x="706" y="114">then scores it against the scene;</text>
    <text x="706" y="132">best kept (a third, simpler try if both</text>
    <text x="706" y="150">are weak), the rest deleted</text>
  </g>
  <rect x="20" y="190" width="960" height="122" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
  <g font-size="12.5" fill="#374151">
    <text x="34" y="214" font-weight="700" fill="#1F2937">Memory: sharing one 8 GB GPU with the tutor</text>
    <text x="34" y="236">• --offload-to-cpu keeps SDXL's weights in RAM and moves each stage (text encoders, UNet, VAE) to the GPU only while it runs.</text>
    <text x="34" y="256">• --type q8_0 converts the 6.46 GiB fp16 checkpoint to 8-bit at load time, roughly halving what has to move.</text>
    <text x="34" y="276">• Idle, sd-server holds about 0.6 GB of VRAM; Settings → Memory-hook pictures → Unload frees it, and Shut down stops it.</text>
    <text x="34" y="296">• Pictures are memory aids only; exact trees, graphs, automata and flowcharts are drawn as SVG by the app (viz.js, Mermaid).</text>
  </g>
</svg>
