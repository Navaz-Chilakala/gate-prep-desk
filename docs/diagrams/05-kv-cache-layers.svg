<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="470" fill="#FFFFFF"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#1F2937">Why qwen3.5:4b has a small KV cache: a hybrid of linear-attention and full-attention layers</text>
  <text x="20" y="62" font-size="13" font-weight="700" fill="#374151">qwen3.5:4b · 32 layers</text>
  <!-- 32 blocks: every 4th is full attention -->
  <g>
    <rect x="52" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="80" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="108" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="136" y="76" width="24" height="40" rx="4" fill="#2C4BB3"/>
    <rect x="164" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="192" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="220" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="248" y="76" width="24" height="40" rx="4" fill="#2C4BB3"/>
    <rect x="276" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="304" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="332" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="360" y="76" width="24" height="40" rx="4" fill="#2C4BB3"/>
    <rect x="388" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="416" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="444" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="472" y="76" width="24" height="40" rx="4" fill="#2C4BB3"/>
    <rect x="500" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="528" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="556" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="584" y="76" width="24" height="40" rx="4" fill="#2C4BB3"/>
    <rect x="612" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="640" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="668" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="696" y="76" width="24" height="40" rx="4" fill="#2C4BB3"/>
    <rect x="724" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="752" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="780" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="808" y="76" width="24" height="40" rx="4" fill="#2C4BB3"/>
    <rect x="836" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="864" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="892" y="76" width="24" height="40" rx="4" fill="#10B981"/><rect x="920" y="76" width="24" height="40" rx="4" fill="#2C4BB3"/>
  </g>
  <!-- KV stacks under the 8 attention layers -->
  <g fill="#F59E0B">
    <rect x="140" y="122" width="16" height="44" rx="2"/><rect x="252" y="122" width="16" height="44" rx="2"/><rect x="364" y="122" width="16" height="44" rx="2"/><rect x="476" y="122" width="16" height="44" rx="2"/>
    <rect x="588" y="122" width="16" height="44" rx="2"/><rect x="700" y="122" width="16" height="44" rx="2"/><rect x="812" y="122" width="16" height="44" rx="2"/><rect x="924" y="122" width="16" height="44" rx="2"/>
  </g>
  <text x="52" y="190" font-size="12.5" fill="#374151">Orange: K and V for every token, kept for the whole conversation (grows with context). Green layers keep only a fixed-size state.</text>

  <!-- two explanation panels -->
  <rect x="20" y="210" width="470" height="150" rx="12" fill="#EEF2FB" stroke="#2C4BB3"/>
  <rect x="34" y="226" width="14" height="14" rx="3" fill="#2C4BB3"/><text x="56" y="238" font-size="13.5" font-weight="700" fill="#1E3A8A">8 full-attention layers (KV cache)</text>
  <g font-size="12.5" fill="#374151">
    <text x="34" y="264">per token: 8 layers × 2 (K, V) × 4 KV heads × 256 dims × 2 bytes</text>
    <text x="34" y="284">= 32 KiB per token</text>
    <text x="34" y="310">× 16,384 tokens = <tspan font-weight="700">512 MiB</tspan> (K 256 + V 256)</text>
    <text x="34" y="332">Grouped-query attention: 16 query heads share 4 K/V heads,</text>
    <text x="34" y="350">which already cuts the cache by 4×.</text>
  </g>
  <rect x="510" y="210" width="470" height="150" rx="12" fill="#E7F4EC" stroke="#2E7D4F"/>
  <rect x="524" y="226" width="14" height="14" rx="3" fill="#10B981"/><text x="546" y="238" font-size="13.5" font-weight="700" fill="#14532D">24 linear-attention (Gated DeltaNet) layers</text>
  <g font-size="12.5" fill="#374151">
    <text x="524" y="264">Each keeps a fixed matrix "memory" instead of every token:</text>
    <text x="524" y="284">32 heads × 128 × 128 values (f32) + a short conv window</text>
    <text x="524" y="310">all 24 together: <tspan font-weight="700">50 MiB</tspan>, the same at 1 K or 256 K tokens</text>
    <text x="524" y="332">Cost: they summarise the past, so exact long-range</text>
    <text x="524" y="350">recall comes from the 8 attention layers.</text>
  </g>

  <!-- comparison -->
  <text x="20" y="392" font-size="13" font-weight="700" fill="#374151">For comparison, at the same 16,384 tokens</text>
  <g font-size="12.5" fill="#374151">
    <text x="20" y="416">mistral-nemo 12B: all 40 layers attend · 40 × 2 × 8 heads × 128 × 2 B = 160 KiB/token → <tspan font-weight="700">2,560 MiB</tspan> (5× more)</text>
    <text x="20" y="438">qwen2.5-coder 7B: 28 layers · 28 × 2 × 4 × 128 × 2 B = 56 KiB/token → <tspan font-weight="700">896 MiB</tspan> (calculated)</text>
    <text x="20" y="460">A plain 32-layer model shaped like qwen3.5 would need 4× its cache: 2 GiB.</text>
  </g>
</svg>
