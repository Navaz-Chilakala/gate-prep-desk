<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="1000" height="380" fill="#FFFFFF"/>
  <g font-size="12.5" fill="#374151" text-anchor="middle">
    <!-- 1 -->
    <rect x="20" y="40" width="150" height="86" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
    <text x="95" y="68" font-weight="700" font-size="13.5" fill="#1F2937">Double-click</text>
    <text x="95" y="88">"GATE Prep Desk"</text>
    <text x="95" y="106">desktop shortcut</text>
    <line x1="170" y1="83" x2="198" y2="83" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
    <!-- 2 -->
    <rect x="200" y="40" width="150" height="86" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
    <text x="275" y="68" font-weight="700" font-size="13.5" fill="#1F2937">GATE Prep Desk.vbs</text>
    <text x="275" y="88">starts launcher.ps1</text>
    <text x="275" y="106">with no console window</text>
    <line x1="350" y1="83" x2="378" y2="83" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
    <!-- decision ollama -->
    <polygon points="465,30 550,83 465,136 380,83" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/>
    <text x="465" y="80" font-weight="700" fill="#78350F">Ollama</text>
    <text x="465" y="97" fill="#78350F">answering?</text>
    <line x1="465" y1="136" x2="465" y2="198" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="478" y="170" text-anchor="start" font-size="12" fill="#B45309">no</text>
    <rect x="380" y="200" width="170" height="78" rx="10" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/>
    <text x="465" y="226" font-weight="700" fill="#78350F">Start Ollama</text>
    <text x="465" y="245">ollama app.exe</text>
    <text x="465" y="262">(2 parallel slots)</text>
    <line x1="550" y1="83" x2="588" y2="83" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="568" y="74" font-size="12" fill="#15803D">yes</text>
    <line x1="550" y1="239" x2="572" y2="239" stroke="#475569" stroke-width="1.6"/><line x1="572" y1="239" x2="572" y2="83" stroke="#475569" stroke-width="1.6"/>
    <!-- decision server -->
    <polygon points="675,30 760,83 675,136 590,83" fill="#E7F4EC" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="675" y="80" font-weight="700" fill="#14532D">Server</text>
    <text x="675" y="97" fill="#14532D">answering?</text>
    <line x1="675" y1="136" x2="675" y2="198" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="688" y="170" text-anchor="start" font-size="12" fill="#B45309">no</text>
    <rect x="590" y="200" width="170" height="78" rx="10" fill="#E7F4EC" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="675" y="226" font-weight="700" fill="#14532D">Start server.ps1</text>
    <text x="675" y="245">hidden PowerShell</text>
    <text x="675" y="262">waits up to 15 s for /api/ping</text>
    <line x1="760" y1="83" x2="798" y2="83" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="778" y="74" font-size="12" fill="#15803D">yes</text>
    <line x1="760" y1="239" x2="782" y2="239" stroke="#475569" stroke-width="1.6"/><line x1="782" y1="239" x2="782" y2="83" stroke="#475569" stroke-width="1.6"/>
    <!-- open -->
    <rect x="800" y="40" width="180" height="86" rx="10" fill="#EEF2FB" stroke="#2C4BB3" stroke-width="1.5"/>
    <text x="890" y="68" font-weight="700" font-size="13.5" fill="#1E3A8A">Open the app</text>
    <text x="890" y="88">Edge/Chrome --app window</text>
    <text x="890" y="106">http://localhost:8765</text>
    <line x1="890" y1="126" x2="890" y2="198" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="800" y="200" width="180" height="78" rx="10" fill="#EEF2FB" stroke="#2C4BB3" stroke-width="1.5"/>
    <text x="890" y="226" font-weight="700" fill="#1E3A8A">Page starts</text>
    <text x="890" y="245">reads _hub.json, lists models,</text>
    <text x="890" y="262">shows "Tutor ready"</text>
  </g>
  <text x="20" y="330" font-size="13" fill="#4B5563">Models are not loaded at start-up: Ollama loads a model on the first request that names it, then keeps it for 5 minutes after its last use.</text>
  <text x="20" y="352" font-size="13" fill="#4B5563">Stopping: Settings → Shut down calls /api/quit, which also stops the image generator (sd-server.exe). Ollama keeps running in the tray.</text>
</svg>
