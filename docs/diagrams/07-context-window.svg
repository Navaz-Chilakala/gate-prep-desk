<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="360" fill="#FFFFFF"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#1F2937">What fills the 16,384-token window in one tutor-chat turn (typical, about 4 characters per token)</text>
  <!-- bar: x 20..980 = 16384 tokens => 0.05859 px/token -->
  <g font-size="12" font-weight="700">
    <rect x="20" y="56" width="53" height="58" fill="#2C4BB3"/>
    <rect x="73" y="56" width="15" height="58" fill="#10B981"/>
    <rect x="88" y="56" width="234" height="58" fill="#7048C8"/>
    <text x="205" y="90" text-anchor="middle" fill="#FFFFFF">context ≤ 4,000</text>
    <rect x="322" y="56" width="88" height="58" fill="#EC4899"/>
    <text x="366" y="90" text-anchor="middle" fill="#FFFFFF">notes, web</text>
    <rect x="410" y="56" width="293" height="58" fill="#F59E0B"/>
    <text x="556" y="90" text-anchor="middle" fill="#1F2937">conversation (last 9 messages)</text>
    <rect x="703" y="56" width="10" height="58" fill="#111827"/>
    <rect x="713" y="56" width="176" height="58" fill="#FFFFFF" stroke="#111827" stroke-dasharray="5 3"/>
    <text x="801" y="82" text-anchor="middle" fill="#111827">answer budget</text>
    <text x="801" y="100" text-anchor="middle" font-weight="400" fill="#374151">num_predict 3,000</text>
    <rect x="889" y="56" width="91" height="58" fill="#F3F4F6"/>
    <text x="934" y="90" text-anchor="middle" font-weight="400" fill="#6B7280">headroom</text>
  </g>
  <g font-size="11.5" fill="#374151">
    <line x1="46" y1="114" x2="46" y2="140" stroke="#2C4BB3"/><text x="20" y="154">rules ~900</text>
    <line x1="80" y1="114" x2="80" y2="172" stroke="#10B981"/><text x="20" y="186">verified facts ~250</text>
    <line x1="708" y1="114" x2="708" y2="140" stroke="#111827"/><text x="650" y="154">your question</text>
  </g>
  <text x="20" y="226" font-size="13" font-weight="700" fill="#1F2937">How the app keeps everything inside the window</text>
  <g font-size="12.5" fill="#374151">
    <text x="20" y="252">• One fixed num_ctx (16,384) for every call: changing it would make Ollama reload the model (10+ seconds).</text>
    <text x="20" y="274">• Context is capped before sending: a lesson 16,000 characters, a book 22,000 (the most relevant pages only), notes and web snippets trimmed.</text>
    <text x="20" y="296">• Only the last 9 messages of a chat are sent; each answer is capped by num_predict (3,000 tokens for chat, 4,000 by default).</text>
    <text x="20" y="318">• An attached image becomes a few hundred vision tokens (the encoder works on 768 × 768 pixels in 16-pixel patches).</text>
    <text x="20" y="340">• If a prompt still overflows, Ollama trims the oldest part; the app's caps are set so this does not normally happen.</text>
  </g>
</svg>
